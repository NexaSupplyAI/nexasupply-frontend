server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Legacy static-only configuration. Production uses server.mjs so that
    # only the trusted Easy Auth identity can be exchanged for an internal JWT.
    # Never forward a browser-supplied Authorization header to the APIs.
    location /backend/ {
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
